<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit Proof</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1b1e28; --muted:#6b7280; --brand:#4f46e5; --line:#e5e7eb; --ok:#16a34a; --err:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .num { background:var(--brand); color:#fff; width:22px; height:22px; border-radius:50%; font-size:12px; display:inline-grid; place-items:center; }
  input[type=text], input[type=url] { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  input:focus { outline:2px solid var(--brand); border-color:transparent; }
  .drop { display:block; width:100%; border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); cursor:pointer; position:relative; }
  .drop.has { border-color:var(--ok); color:var(--ink); }
  .drop input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop img { max-width:100%; max-height:220px; border-radius:8px; display:block; margin:10px auto 0; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:12px; text-align:center; font-weight:500; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .linkbtn { display:block; text-align:center; padding:14px; border-radius:12px; background:#eef2ff; color:var(--brand); font-weight:600; text-decoration:none; word-break:break-all; border:1px solid #c7d2fe; }
  .linkbtn:hover { background:#e0e7ff; }
</style>
</head>
<body>
<main>
  <h1>Apna Proof Submit Karein</h1>
  <p class="sub">Neeche diye link par jaakar like aur comment karein, phir dono ke screenshot upload karein.</p>

  <form id="f">
    <div class="card">
      <h2><span class="num">1</span> <span id="ltitle">Link</span></h2>
      <a id="linkbtn" class="linkbtn" href="#" target="_blank" rel="noopener noreferrer" style="display:none">Link kholein ↗</a>
      <div id="nolink" style="color:var(--muted)">Link jald hi yahan aayega.</div>
      <div style="height:12px"></div>
      <input type="text" name="name" placeholder="Aapka naam (optional)" maxlength="80">
    </div>

    <div class="card">
      <h2><span class="num">2</span> Like ka screenshot</h2>
      <label class="drop" id="d1">
        <span>Tap karke screenshot chunein</span>
        <input type="file" name="like_screenshot" accept="image/*" required>
      </label>
    </div>

    <div class="card">
      <h2><span class="num">3</span> Comment ka screenshot</h2>
      <label class="drop" id="d2">
        <span>Tap karke screenshot chunein</span>
        <input type="file" name="comment_screenshot" accept="image/*" required>
      </label>
    </div>

    <button id="btn" type="submit">Submit</button>
    <div id="msg"></div>
  </form>
</main>

<script>
  // admin ka set kiya hua link dikhao
  fetch('/api/config').then((r) => r.json()).then((c) => {
    if (c.closed) {
      document.getElementById('f').innerHTML =
        '<div class="card" style="text-align:center;padding:30px 18px"><h2 style="justify-content:center;font-size:20px;margin:0 0 8px">🚫 Campaign band ho gaya hai</h2><div style="color:var(--muted)">Ab nayi submissions nahi li ja rahi hain. Dhanyavaad!</div></div>';
      document.querySelector('p.sub').textContent = 'Ye campaign ab khatam ho chuka hai.';
      return;
    }
    if (c.title) document.getElementById('ltitle').textContent = c.title;
    if (c.link) {
      const a = document.getElementById('linkbtn');
      a.href = c.link; a.textContent = c.link; a.style.display = 'block';
      document.getElementById('nolink').style.display = 'none';
    }
  }).catch(() => {});

  // preview
  document.querySelectorAll('.drop').forEach((drop) => {
    const input = drop.querySelector('input');
    input.addEventListener('change', () => {
      const file = input.files[0];
      drop.querySelector('img')?.remove();
      if (!file) { drop.classList.remove('has'); return; }
      drop.classList.add('has');
      drop.querySelector('span').textContent = file.name;
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      drop.appendChild(img);
    });
  });

  // screenshot ko chhota karo (Vercel ki upload limit ke andar rehne ke liye)
  async function shrink(file) {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
      if (blob && blob.size < file.size) return new File([blob], 'shot.jpg', { type: 'image/jpeg' });
    } catch (e) {}
    return file;
  }

  const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; msg.textContent = 'Upload ho raha hai...'; msg.className = '';
    try {
      const like = await shrink(f.like_screenshot.files[0]);
      const comment = await shrink(f.comment_screenshot.files[0]);
      if (like.size > 2 * 1024 * 1024 || comment.size > 2 * 1024 * 1024)
        throw new Error('Screenshot bahut bada hai (max 2MB). Chhota screenshot try karein.');
      const fd = new FormData();
      fd.append('name', f.name.value);
      fd.append('like_screenshot', like, like.name);
      fd.append('comment_screenshot', comment, comment.name);
      const r = await fetch('/api/submit', { method: 'POST', body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Kuch galat hua');
      msg.textContent = '✅ Submit ho gaya! Dhanyavaad.'; msg.className = 'ok';
      f.reset();
      document.querySelectorAll('.drop').forEach((d, i) => {
        d.classList.remove('has'); d.querySelector('img')?.remove();
        d.querySelector('span').textContent = 'Tap karke screenshot chunein';
      });
    } catch (err) {
      msg.textContent = err.message; msg.className = 'err';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
