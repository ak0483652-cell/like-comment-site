<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Panel</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1b1e28; --muted:#6b7280; --brand:#4f46e5; --line:#e5e7eb; --ok:#16a34a; --err:#dc2626; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  .login { max-width:340px; margin:90px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  input[type=password] { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin:10px 0; }
  button { padding:9px 14px; border:0; border-radius:9px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer; font-size:14px; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.ok { background:var(--ok); } button.bad { background:var(--err); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .row { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .meta { color:var(--muted); font-size:13px; }
  .link { word-break:break-all; color:var(--brand); }
  .badge { font-size:12px; padding:3px 10px; border-radius:99px; font-weight:600; }
  .pending { background:#fef3c7; color:var(--warn); } .approved { background:#dcfce7; color:var(--ok); } .rejected { background:#fee2e2; color:var(--err); }
  .shots { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .shots { grid-template-columns:1fr; } }
  .shots figure { margin:0; }
  .shots figcaption { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .shots img { width:100%; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; background:#fafafa; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .empty { text-align:center; color:var(--muted); padding:50px 0; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; place-items:center; z-index:50; cursor:zoom-out; }
  #lightbox img { max-width:94vw; max-height:94vh; border-radius:8px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="lightbox"><img alt=""></div>

<script>
  const app = document.getElementById('app');
  let all = [], filter = 'all', cfg = { link: '', title: '' };

  const api = async (url, opts = {}) => {
    const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
    if (r.status === 401) { showLogin(); throw new Error('401'); }
    return r.json();
  };

  function showLogin(err) {
    app.innerHTML = `
      <form class="login" id="lf">
        <h2 style="margin:0">Admin Login</h2>
        <input type="password" id="pw" placeholder="Password" autofocus>
        <button style="width:100%">Login</button>
        <div style="color:var(--err);margin-top:8px;font-size:14px">${err || ''}</div>
      </form>`;
    document.getElementById('lf').onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('pw').value }) });
      r.ok ? load() : showLogin('Galat password');
    };
  }

  async function load() {
    try { all = await api('/api/admin/submissions'); cfg = await api('/api/admin/config'); } catch { return; }
    render();
  }

  async function saveCfg() {
    const r = await fetch('/api/admin/config', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ link: document.getElementById('cfgLink').value, title: document.getElementById('cfgTitle').value }) });
    const j = await r.json(); const m = document.getElementById('cfgMsg');
    if (r.ok) { cfg = { link: document.getElementById('cfgLink').value.trim(), title: document.getElementById('cfgTitle').value.trim() }; m.textContent = '✅ Save ho gaya'; m.style.color = 'var(--ok)'; }
    else { m.textContent = j.error || 'Error'; m.style.color = 'var(--err)'; }
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function render() {
    const counts = { all: all.length, pending: 0, approved: 0, rejected: 0 };
    all.forEach((s) => counts[s.status]++);
    const list = filter === 'all' ? all : all.filter((s) => s.status === filter);

    app.innerHTML = `
      <header><h1>📥 Submissions (${all.length})</h1>
        <div><button class="ghost" onclick="load()">Refresh</button> <button class="ghost" onclick="logout()">Logout</button></div>
      </header>
      <main>
        <div class="row">
          <b>🔗 Users ko dikhne wala link</b>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <input id="cfgTitle" placeholder="Heading (optional)" value="${esc(cfg.title || '')}" style="flex:1 1 180px;padding:10px;border:1px solid var(--line);border-radius:9px">
            <input id="cfgLink" placeholder="https://..." value="${esc(cfg.link || '')}" style="flex:3 1 280px;padding:10px;border:1px solid var(--line);border-radius:9px">
            <button onclick="saveCfg()">Save link</button>
          </div>
          <div id="cfgMsg" class="meta" style="margin-top:6px"></div>
        </div>
        <div class="tabs">
          ${['all','pending','approved','rejected'].map((t) =>
            `<button class="ghost ${filter===t?'active':''}" onclick="setFilter('${t}')">${t[0].toUpperCase()+t.slice(1)} (${counts[t]})</button>`).join('')}
        </div>
        ${list.length ? list.map(card).join('') : '<div class="empty">Abhi koi submission nahi hai.</div>'}
      </main>`;
    document.querySelectorAll('.shots img').forEach((img) => img.onclick = () => {
      const lb = document.getElementById('lightbox'); lb.querySelector('img').src = img.src; lb.style.display = 'grid';
    });
  }

  function card(s) {
    return `
      <div class="row">
        <div class="top">
          <div>
            <b>${s.name ? esc(s.name) : 'Anonymous'}</b>
            <div class="meta">${new Date(s.created_at).toLocaleString('en-IN')}${s.link ? ' · Link: ' + esc(s.link) : ''}</div>
          </div>
          <span class="badge ${s.status}">${s.status}</span>
        </div>
        <div class="shots">
          <figure><figcaption>👍 Like screenshot · <a href="/admin/dl?path=${encodeURIComponent(s.like_path)}">Download</a></figcaption><img src="${esc(s.like_url)}" loading="lazy"></figure>
          <figure><figcaption>💬 Comment screenshot · <a href="/admin/dl?path=${encodeURIComponent(s.comment_path)}">Download</a></figcaption><img src="${esc(s.comment_url)}" loading="lazy"></figure>
        </div>
        <div class="actions">
          <button class="ok" onclick="setStatus('${s.id}','approved')">Approve</button>
          <button class="bad" onclick="setStatus('${s.id}','rejected')">Reject</button>
          <button class="ghost" onclick="setStatus('${s.id}','pending')">Pending</button>
          <button class="ghost" onclick="del('${s.id}')">🗑 Delete</button>
        </div>
      </div>`;
  }

  const setFilter = (f) => { filter = f; render(); };
  const setStatus = async (id, status) => { await api(`/api/admin/submissions/${id}/status`, { method:'POST', body: JSON.stringify({ status }) }); load(); };
  const del = async (id) => { if (confirm('Delete kar dein?')) { await api(`/api/admin/submissions/${id}`, { method:'DELETE' }); load(); } };
  const logout = async () => { await api('/api/admin/logout', { method:'POST' }).catch(()=>{}); showLogin(); };
  document.getElementById('lightbox').onclick = (e) => e.currentTarget.style.display = 'none';

  load();
</script>
</body>
</html>
